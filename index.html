<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#176B4D" />
    <script>
      // Applied before first paint so there's no flash of the wrong theme.
      (function () {
        var stored = null;
        try { stored = JSON.parse(localStorage.getItem("padhle-appearance") || "null"); } catch (e) { stored = null; }
        var legacy = null;
        try { legacy = localStorage.getItem("padhle-theme"); } catch (e) { legacy = null; }
        var mode = stored && stored.mode ? stored.mode : legacy === "dark" || legacy === "light" ? legacy : "system";
        var palette = stored && stored.palette ? stored.palette : "forest";
        var isDark =
          mode === "dark" ||
          (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.setAttribute("data-palette", palette);
      })();
    </script>
    <title>Padhle — Study smarter. Every day.</title>
    <meta name="description" content="पdhle helps Class 10/12 Board, JEE and NEET students plan, focus, practice, and get exam-ready." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load stylesheet asynchronously so it never blocks first paint; swap for
         FOIT-free text rendering. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Space+Grotesk:wght@500;600&family=Hind:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Space+Grotesk:wght@500;600&family=Hind:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
